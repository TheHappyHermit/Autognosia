services:
  dashboard:
    build: .
    container_name: autognosia-dashboard
    restart: unless-stopped
    ports:
      - '8088:8088'
      - '8089:8089'
    volumes:
      - ./data:/data
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.hermes:/host-hermes:ro
      - ${HOME}/.hermes/profiles:/host-profiles:ro
    environment:
      - AUTOGNOSIA_HOME=/data
      - CONFIG_PATH=/config/services.yaml
      - DOCKER_SOCKET=/var/run/docker.sock
      - DASHBOARD_PORT=8088
      - WS_PORT=8089
      - TZ=UTC
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8088/api/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
