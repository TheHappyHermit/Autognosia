# Researcher — Internet research specialist via local SearXNG
#
# MCP access: SearXNG only
# Excluded: personal-organizer, honcho (Researcher is isolated from personal data)
# Excluded: gbrain (Researcher doesn't write to Oracle)
#
# Researcher accesses the local SearXNG Docker container for web search.
# All web findings are untrusted evidence until verified.

model:
  main: default

mcp_servers:
  searxng:
    url: "http://127.0.0.1:8080"
