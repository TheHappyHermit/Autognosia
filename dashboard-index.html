<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthForge AI — Client Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0f172a;
            --navy-light: #1e293b;
            --navy-mid: #334155;
            --slate: #64748b;
            --gold: #d4af37;
            --gold-light: #e8c84a;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --white: #ffffff;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --red: #ef4444;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--navy);
            color: var(--white);
            overflow: hidden;
        }

        /* Animated gradient background */
        .bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(15, 23, 42, 1) 0%, rgba(15, 23, 42, 0.95) 100%),
                linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { opacity: 1; }
            50% { opacity: 0.92; }
            100% { opacity: 1; }
        }

        /* Subtle grid pattern overlay */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Floating ambient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: var(--emerald);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: var(--gold);
            bottom: -50px; right: -50px;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: var(--emerald);
            top: 60%; left: 70%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Main layout */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Logo / branding */
        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--white);
        }

        .brand h1 span {
            color: var(--emerald);
        }

        .brand p {
            font-size: 14px;
            color: var(--slate);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Glass card */
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--white);
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--slate);
            margin-bottom: 28px;
        }

        /* Form fields */
        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-200);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 10px;
            color: var(--white);
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-wrap input::placeholder {
            color: var(--slate);
        }

        .input-wrap input:focus {
            border-color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .input-wrap .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--slate);
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .input-wrap .toggle-pw:hover {
            color: var(--gray-200);
        }

        .input-wrap .toggle-pw svg {
            width: 18px;
            height: 18px;
        }

        /* Error message */
        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 20px;
        }

        .error-msg.visible {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-msg svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            stroke: #fca5a5;
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-submit .btn-text { transition: opacity 0.2s; }
        .btn-submit .btn-spinner {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
        }

        .btn-submit.loading .btn-text { opacity: 0; }
        .btn-submit.loading .btn-spinner { display: flex; }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Trust footer */
        .trust {
            margin-top: 28px;
            text-align: center;
        }

        .trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--slate);
            background: rgba(15, 23, 42, 0.4);
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .trust-badge svg {
            width: 12px;
            height: 12px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 2;
        }

        .trust-badge .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--slate);
            opacity: 0.5;
        }

        .trust-footer {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(100, 116, 139, 0.6);
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
                border-radius: 16px;
            }
            .brand h1 { font-size: 24px; }
            .brand-icon { width: 48px; height: 48px; }
            .brand-icon svg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1>Wealth<span>Forge</span> AI</h1>
            <p>Intelligent Wealth Management</p>
        </div>

        <div class="card">
            <h2 class="card-title">Welcome back</h2>
            <p class="card-subtitle">Sign in to access your portfolio</p>

            <div class="error-msg" id="errorMsg">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="errorText">Invalid credentials</span>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner"><div class="spinner"></div></span>
                </button>
            </form>
        </div>

        <div class="trust">
            <div class="trust-badge">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Fee-Only Fiduciary
                <span class="dot"></span>
                SEC Registered
            </div>
            <p class="trust-footer">&copy; 2026 WealthForge AI &middot; All rights reserved</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const togglePw = document.getElementById('togglePw');
        const eyeIcon = document.getElementById('eyeIcon');

        // Show/hide password
        togglePw.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        // Clear error on input
        [usernameInput, passwordInput].forEach(el => {
            el.addEventListener('input', () => {
                errorMsg.classList.remove('visible');
            });
        });

        // Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Please enter your username and password.');
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: username, password: password })
                });

                const data = await res.json();

                if (res.ok && (data.token || data.access_token)) {
                    localStorage.setItem('token', data.token || data.access_token);
                    window.location.href = '/app/';
                } else {
                    showError(data.message || data.error || 'Invalid username or password.');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('visible');
        }
    </script>
</body>
</html>
