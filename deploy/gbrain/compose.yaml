# GBrain Docker Compose — standalone PostgreSQL + pgvector + GBrain HTTP service
# Separate network from other stacks. No database ports exposed to LAN.
#
# This is the advanced PostgreSQL backend. Most users should use PGLite mode
# instead (bun install -g gbrain && gbrain init --pglite).
#
# Prerequisites: Docker, bun, and the gbrain repo cloned locally.
# Clone gbrain: git clone https://github.com/garrytan/gbrain.git
# Place this compose file in the gbrain repo root, or adjust the build context.

version: '3.8'

services:
  gbrain_db:
    image: ankane/pgvector:latest
    container_name: gbrain_db
    environment:
      - POSTGRES_USER=gbrain
      - POSTGRES_PASSWORD=${GBRAIN_DB_PASSWORD:nKYaXRvj7uff0LYT}
      - POSTGRES_DB=gbrain
    volumes:
      - gbrain_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gbrain_network

  gbrain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbrain
    environment:
      - GBRAIN_HOME=/brain
      - DATABASE_URL=postgresql+psycopg2://gbrain:${GBRAIN_DB_PASSWORD:nKYaXRvj7uff0LYT}@gbrain_db:5432/gbrain
      - LLM_BASE_URL=http://${GBRAIN_LLM_HOST:-localhost}:${GBRAIN_LLM_PORT:-8080}/v1
      - LLM_API_KEY=${GBRAIN_LLM_API_KEY:-}
    volumes:
      - ${HOME}/.autognosia/oracle/brain:/brain:ro
    ports:
      - "127.0.0.1:3131:3131"
    depends_on:
      gbrain_db:
        condition: service_healthy
    networks:
      - gbrain_network
    restart: unless-stopped

volumes:
  gbrain_data:

networks:
  gbrain_network:
    driver: bridge
